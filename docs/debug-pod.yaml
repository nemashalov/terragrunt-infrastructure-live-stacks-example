apiVersion: v1
kind: Pod
metadata:
  name: eks-debug-pod
  labels:
    app: debug
spec:
  # Run on the same node as your application (set nodeName or use nodeSelector)
  # nodeName: <your-node-name>
  
  # Required for accessing host processes and modifying sysctls
  hostPID: true
  hostNetwork: true
  hostIPC: true
  
  containers:
  - name: debug
    image: ubuntu:latest
    command: ["sleep", "3600"]
    stdin: true
    tty: true
    securityContext:
      privileged: true
      capabilities:
        add:
        - SYS_ADMIN
        - SYS_PTRACE
        - NET_ADMIN
    volumeMounts:
    - name: sys
      mountPath: /sys
    - name: proc
      mountPath: /host/proc
      readOnly: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  
  volumes:
  - name: sys
    hostPath:
      path: /sys
  - name: proc
    hostPath:
      path: /proc

---
# ServiceAccount with necessary permissions (optional, for RBAC environments)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: debug-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: debug-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: debug-role
subjects:
- kind: ServiceAccount
  name: debug-sa
  namespace: default
